services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketbooking"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketbooking-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ticketbooking-network

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - ticketbooking-network

networks:
  ticketbooking-network:

volumes:
  pgdata: