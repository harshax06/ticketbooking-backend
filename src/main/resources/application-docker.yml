spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ticketbooking
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET}