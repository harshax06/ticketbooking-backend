spring:
  application:
    name: ticketbooking
  datasource:
    url: jdbc:postgresql://localhost:5433/ticketbooking
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
        one-indexed-parameters: false

server:
  port: 8080