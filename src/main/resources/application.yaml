spring:
  application:
    name: ticketbooking
  datasource:
    url: jdbc:postgresql://localhost:5433/ticketbooking
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
        one-indexed-parameters: false

jwt:
  secret: ${JWT_SECRET:A5I4qLeNjkdgRhueN1ZiRtmxjrB9l9FVf7U+4pMrK30=}
  expiration-ms: 3600000

server:
  port: 8080